<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cubo Magico 3D</title>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

  </style>
</head>

<body>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

  <script>

    // =========================================
    // CENA
    // =========================================

    const cena = new THREE.Scene();

    // =========================================
    // CAMERA
    // =========================================

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 0, 7);

    // =========================================
    // RENDERIZADOR
    // =========================================

    const renderizador = new THREE.WebGLRenderer({
      antialias: true
    });

    renderizador.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document.body.appendChild(
      renderizador.domElement
    );

    // =========================================
    // ORBIT CONTROLS
    // =========================================

    const controls = new THREE.OrbitControls(
      camera,
      renderizador.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableKeys = false;

    // =========================================
    // CONTADOR DE MOVIMENTOS
    // =========================================

    let movimentos = 0;

    // =========================================
    // INTERFACE GRAFICA
    // =========================================

    const painel = document.createElement("div");

    painel.style.position = "absolute";
    painel.style.top = "20px";
    painel.style.left = "20px";
    painel.style.padding = "15px";
    painel.style.background = "rgba(0,0,0,0.7)";
    painel.style.color = "white";
    painel.style.fontFamily = "Arial";
    painel.style.fontSize = "20px";
    painel.style.borderRadius = "10px";

    painel.innerHTML = `
      <b>Cubo Mágico 3D</b><br><br>

      Movimentos:
      <span id="contador">0</span>

      <br><br>

      Controles:<br>
      ← → Rotação Y<br>
      ↑ ↓ Rotação X<br>
      Mouse = OrbitControls
    `;

    document.body.appendChild(painel);

    // =========================================
    // CUBO MAGICO
    // =========================================

    const cuboMagico = new THREE.Group();

    const geometria = new THREE.BoxGeometry(
      0.95,
      0.95,
      0.95
    );

    const materiais = [
      new THREE.MeshBasicMaterial({ color: 0xff0000 }), // direita  (+X) vermelho
      new THREE.MeshBasicMaterial({ color: 0xff8800 }), // esquerda (-X) laranja
      new THREE.MeshBasicMaterial({ color: 0xffffff }), // topo     (+Y) branco
      new THREE.MeshBasicMaterial({ color: 0xffff00 }), // base     (-Y) amarelo
      new THREE.MeshBasicMaterial({ color: 0x00ff00 }), // frente   (+Z) verde
      new THREE.MeshBasicMaterial({ color: 0x0000ff })  // tras     (-Z) azul
    ];

    // --- 27 cubinhos ---
    for (let x = -1; x <= 1; x++) {

      for (let y = -1; y <= 1; y++) {

        for (let z = -1; z <= 1; z++) {

          const cubinho = new THREE.Mesh(
            geometria,
            materiais
          );

          cubinho.position.set(x, y, z);

          cuboMagico.add(cubinho);
        }
      }
    }

    cena.add(cuboMagico);
    // =========================================
    // CONTROLE DO TECLADO
    // =========================================
    const teclas = {};

    window.addEventListener("keydown", (evento) => {
      
      teclas[evento.key] = true; 

      if (!evento.repeat) {

        // Inicia o giro se não tiver outra face rodando
        if (evento.key === "1" && !faceAnimando) {
          faceAnimando = "1";
          progressoGiro = 0;
          registrarMovimento(); // Contador só entra aqui!
        }

        if (evento.key === "2" && !faceAnimando) {
          faceAnimando = "2";
          progressoGiro = 0;
          registrarMovimento(); // E aqui!
        }

      }
      
    });

    window.addEventListener("keyup", (evento) => {
      teclas[evento.key] = false;
    });
    // =========================================
    // FUNÇÃO DE MOVIMENTOS
    // =========================================

    function registrarMovimento() {

      movimentos++;

      document.getElementById(
        "contador"
      ).innerText = movimentos;

    }

    // =========================================
    // CONTROLE DE ANIMAÇÃO DAS FACES
    // =========================================

    let faceAnimando = null;
    let progressoGiro = 0;
    const ALVO_GIRO = Math.PI / 2; // 90 graus
    const PASSO_GIRO = 0.05;

    const grupoFace = new THREE.Group();
    cuboMagico.add(grupoFace);

    // =========================================
    // LOOP DE ANIMAÇÃO
    // =========================================

    function animate() {

      requestAnimationFrame(animate);

      // ---------------------------------
      // Rotação eixo Y
      // ---------------------------------

      if (teclas["ArrowLeft"]) {

        cuboMagico.rotation.y -= 0.03;

      }

      if (teclas["ArrowRight"]) {

        cuboMagico.rotation.y += 0.03;

      }

      // ---------------------------------
      // Rotação eixo X
      // ---------------------------------

      if (teclas["ArrowUp"]) {

        cuboMagico.rotation.x -= 0.03;

      }

      if (teclas["ArrowDown"]) {

        cuboMagico.rotation.x += 0.03;

      }



      // ---------------------------------
      // Rotação das Faces (Giro completo de 90 graus)
      // ---------------------------------
      
      if (faceAnimando) {

        let passoAtual = PASSO_GIRO;

        // Ajusta o último passo para cravar exatos 90 graus
        if (progressoGiro + PASSO_GIRO > ALVO_GIRO) {
          passoAtual = ALVO_GIRO - progressoGiro;
        }

        // 1. "adicione os cubinhos corretos ao grupo" (Só roda no frame inicial)
        if (progressoGiro === 0) {
          
          const cubosAlvo = [];
          
          cuboMagico.children.forEach(c => {
            // Ignora o próprio grupoFace, procura apenas as malhas (Mesh)
            if (c.type === "Mesh") {
              if (faceAnimando === "1" && Math.round(c.position.y) === 1) cubosAlvo.push(c);
              if (faceAnimando === "2" && Math.round(c.position.x) === 1) cubosAlvo.push(c);
            }
          });

          // O attach é o "ancorar" que faz o cubo mudar de grupo sem sair da posição visual
          cubosAlvo.forEach(c => grupoFace.attach(c));
          
        }

        // 2. "anime a rotação" do grupo temporário
        if (faceAnimando === "1") {
          grupoFace.rotation.y += passoAtual;
        }

        if (faceAnimando === "2") {
          grupoFace.rotation.x -= passoAtual;
        }

        progressoGiro += passoAtual;

        // 3. "depois ancore novamente os cubinhos de volta à cena"
        if (progressoGiro >= ALVO_GIRO) {
          
          faceAnimando = null;
          
          while (grupoFace.children.length > 0) {
            const cubinho = grupoFace.children[0];
            
            cuboMagico.attach(cubinho); // Volta para o cubo principal
            
            // Trava nos números inteiros para não ficar desalinhado
            cubinho.position.x = Math.round(cubinho.position.x);
            cubinho.position.y = Math.round(cubinho.position.y);
            cubinho.position.z = Math.round(cubinho.position.z);
          }

          // Zera a rotação do grupo vazio para a próxima jogada
          grupoFace.rotation.set(0, 0, 0);

        }

      }

      // Atualiza OrbitControls
      controls.update();

      // Renderiza cena
      renderizador.render(cena, camera);
    }

    animate();

    // =========================================
    // RESPONSIVIDADE
    // =========================================

    window.addEventListener("resize", () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderizador.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });

  </script>

</body>
</html>
