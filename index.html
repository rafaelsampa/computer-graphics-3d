<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cubo Magico 3D</title>
  <style>body { margin: 0; }</style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>

    // --- O mundo 3D ---
    const cena = new THREE.Scene();

    // --- A camera ---
    const camera = new THREE.PerspectiveCamera(
      45, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 0, 7);

    // --- O renderizador ---
    const renderizador = new THREE.WebGLRenderer();
    renderizador.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderizador.domElement);

    // --- O cubo magico: grupo com 27 cubinhos ---
    const cuboMagico = new THREE.Group();

    const geometria = new THREE.BoxGeometry(0.95, 0.95, 0.95);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const cubinho = new THREE.Mesh(geometria, material);
          cubinho.position.set(x, y, z);
          cuboMagico.add(cubinho);
        }
      }
    }

    cena.add(cuboMagico);

    // --- Rotacao da face de cima com a tecla "1" (anti-horario) ---
    document.addEventListener('keydown', (e) => {
      if (e.key === '1') {
        const grupoFace = new THREE.Group();
        cena.add(grupoFace);

        const topo = cuboMagico.children.filter(c => c.position.y > 0.5);
        topo.forEach(c => grupoFace.attach(c));

        grupoFace.rotateY(-Math.PI / 2);

        topo.forEach(c => cuboMagico.attach(c));
        cena.remove(grupoFace);

        renderizador.render(cena, camera);
      }
    });

    renderizador.render(cena, camera);

  </script>
</body>
</html>
